# Phase 9 — Baseline Validation & Robustness Preparation.
#
# This config is SEPARATE from configs/baseline.yaml and configs/cnn_extractor.yaml.
# Phase 9 does not change the frozen Phase 6 baseline in any way: it only *runs*
# the frozen embed() / extract_traditional() and the already-trained Phase 8
# blind extractor, then records structured metrics.
#
# Scope guard (what Phase 9 deliberately does NOT do):
#   * no JPEG / noise / blur / crop attacks          -> Phase 10
#   * no adaptive / content-aware embedding          -> Phase 11
#   * no error-correcting codes                      -> Phase 16
#   * no CNN architecture changes                    -> Phase 15
# Phase 9 measures the clean-channel (no-attack) reference that those later
# phases compare their degraded numbers against.
phase9:

  # ---- frozen Phase 6 baseline parameters (must match configs/baseline.yaml) ----
  # Repeated here for a self-contained, reproducible run. run_phase9_validation.py
  # asserts these still equal the frozen baseline before it starts.
  baseline:
    wavelet: haar
    mode: symmetric
    subband: LL
    start_sv_index: 0
    # Frozen strength sweep. Phase 9 evaluates every alpha in this list.
    alphas: [0.005, 0.010, 0.015]
    # Payload sizes to validate. All five fit the LL subband alone (128 singular
    # values for a 256x256 image), so the frozen LL-only baseline is used
    # unchanged - no multi-subband overflow is exercised in Phase 9.
    payload_bits: [8, 16, 32, 64, 128]

  # ---- evaluation data ----
  data:
    processed_root: data/processed/div2k_256
    # Primary evaluation split. "test" = DIV2K IDs 0801-0900, held out from every
    # earlier phase (Phase 6 characterisation used the first 40; Phase 8 trained
    # on train+validation). Phase 9 uses the whole split by default.
    eval_split: test
    eval_num_images: 100        # cap; 100 => the full test split
    image_size: 256

  # ---- deterministic payloads ----
  # For image index i, a 128-bit master payload is drawn from
  # numpy.random.default_rng(payload_seed + i); an N-bit payload is its first N
  # bits. Payloads are therefore nested across sizes and identical on every run.
  payload_seed: 20260901

  # ---- Phase 8 blind CNN extractor (evaluated separately, architecture frozen) ----
  cnn:
    enabled: true
    checkpoint: models/phase8_cnn/phase8_cnn_best.pt
    # The checkpoint's trained operating point. run_phase9_validation.py reads the
    # real values from the checkpoint and asserts they match these.
    bit_length: 64
    alpha: 0.02
    # Payload convention used when Phase 8 built its deterministic val/test set,
    # reused here so the comparison lines up with the training-time metrics.
    payload_seed: 20260901

  # ---- output ----
  output:
    results_dir: results/phase9_validation
    make_plots: true
