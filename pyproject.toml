[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-watermarking"
version = "0.1.0"
description = "Reproducible research framework for invisible DWT-SVD image watermarking."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Deep Watermarking Research Team" }]
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "PyWavelets>=1.6,<2",
  "opencv-python>=4.10,<5",
  "scikit-image>=0.24,<1",
  "PyYAML>=6.0,<7",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
training = [
  "torch>=2.4",
  "torchvision>=0.19",
]
tracking = [
  "mlflow>=2.15,<4",
  "dvc>=3.50,<4",
]
api = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "httpx2",  # required by this environment's starlette.testclient (Starlette 1.6)
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
